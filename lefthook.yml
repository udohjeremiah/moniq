pre-commit:
  parallel: false
  commands:
    format:
      priority: 1
      run: pnpm prettier --ignore-unknown --write {staged_files}
      stage_fixed: true
    lint:
      priority: 2
      glob: "packages/**/*.{js,cjs,mjs,ts,cts,mts,jsx,tsx}"
      exclude:
        - "packages/docs/**"
      run: pnpm eslint --fix --max-warnings=0 {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

prepare-commit-msg:
  commands:
    commitizen:
      interactive: true
      run: pnpm cz --hook || true

pre-push:
  parallel: false
  commands:
    knip:
      run: pnpm knip
    typecheck:
      run: pnpm typecheck
    build:
      run: pnpm build
    test:
      run: pnpm test
