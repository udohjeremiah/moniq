pre-commit:
  parallel: false
  commands:
    format:
      priority: 1
      run: <package-manager> prettier --ignore-unknown --write {staged_files}
      stage_fixed: true
    lint:
      priority: 2
      glob: "*.{js,jsx,ts,tsx}"
      run: <package-manager> eslint --fix --max-warnings=0 {staged_files}
      stage_fixed: true

prepare-commit-msg:
  commands:
    commitizen:
      interactive: true
      run: <package-manager> cz --hook
      env:
        LEFTHOOK: 0

commit-msg:
  commands:
    commitlint:
      run: <package-manager> commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    knip:
      run: <package-manager> run knip
    typecheck:
      run: <package-manager> run typecheck
